name: Sweep
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: keep this many days
        type: number
        default: 3
permissions:
  contents: write
concurrency:
  group: archive
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clear
        with:
          scope: older
          days: ${{ github.event_name == 'schedule' && '3' || inputs.days }}
          token: ${{ github.token }}
          archive_token: ${{ secrets.ARCHIVE_TOKEN }}
          archive_repo: ${{ vars.ARCHIVE_REPO || 'biures/exhaustable-notes' }}
