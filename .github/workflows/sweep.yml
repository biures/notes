name: Sweep
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: keep this many days
        type: number
        default: 3
permissions:
  contents: write
jobs:
  sweep:
    uses: ./.github/workflows/clear.yml
    with:
      scope: older
      days: ${{ inputs.days || 3 }}
    secrets: inherit
