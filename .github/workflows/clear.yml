name: Clear
on:
  workflow_dispatch:
    inputs:
      scope:
        description: what to delete
        type: choice
        options: [today, all, day, older]
        default: today
      day:
        description: YYYY-MM-DD (scope = day)
        type: string
        required: false
      days:
        description: keep this many days (scope = older)
        type: number
        default: 3
permissions:
  contents: write
concurrency:
  group: archive
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clear
        with:
          scope: ${{ inputs.scope }}
          day: ${{ inputs.day }}
          days: ${{ inputs.days }}
          token: ${{ github.token }}
          archive_token: ${{ secrets.ARCHIVE_TOKEN }}
          archive_repo: ${{ vars.ARCHIVE_REPO || 'biures/exhaustable-notes' }}
